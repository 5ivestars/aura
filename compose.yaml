# Avvio con un solo comando: docker compose up --build
# Il server MCP risponde su http://localhost:8000/mcp
services:
  aura:
    build: .
    image: aura:dev
    env_file:
      - path: ./config.env
        required: false
    environment:
      AURA_HOST: 0.0.0.0
      AURA_PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
