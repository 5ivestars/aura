name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installazione
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formattazione
        run: ruff format --check .
      - name: Test con copertura (minimo 75%)
        run: pytest

  docker:
    name: Build dell'immagine Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t aura:ci .
